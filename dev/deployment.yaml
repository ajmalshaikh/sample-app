apiVersion: apps/v1
kind: Deployment
metadata:
  name: development-deployment
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: development
  template:
    metadata:
      labels:
        app: development
    spec:
      containers:
      - name: sample-app
                image: us-east1-docker.pkg.dev/qwiklabs-gcp-01-76adc4f61891/my-repository/hello-cloudbuild-dev:v1.0
        ports:
        - containerPort: 8080
