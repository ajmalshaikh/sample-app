apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production
  template:
    metadata:
      labels:
        app: production
    spec:
      containers:
      - name: sample-app
        image: us-east1-docker.pkg.dev/qwiklabs-gcp-01-76adc4f61891/my-repository/hello-cloudbuild:v2.0
        ports:
        - containerPort: 8080
